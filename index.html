
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fakhrunisa's professional IT portfolio.">
    <title>Fakhrunisa | IT Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <a href="#" class="logo"><span>.</span></a>
        <span class="nav-label">MY DIGITAL PORTFOLIO</span>
    </header>

    <main>

        <!-- HOME -->
        <section class="hero">
            <p class="intro">HELLO, WELCOME TO MY PORTFOLIO</p>

            <h1>I'm <span>Fakhrunisa.</span></h1>

            <h2>IT Student & Aspiring Developer</h2>

            <p class="hero-text">
                Passionate about technology, web and App development
                and creating meaningful digital experiences.
            </p>

            <p class="explore-text">
                Explore my portfolio below
            </p>
        </section>

        <!-- PORTFOLIO CARDS -->
        <section class="portfolio-section">

            <div class="section-heading">
                <h2>Explore My Portfolio</h2>
            </div>

            <div class="card-grid">

                <button class="portfolio-card" data-section="about">
                    <span class="card-number">01</span>
                    <span class="card-icon">👩🏻‍💻</span>
                    <span class="card-title">About Me</span>
                    <span class="card-description">My background and career objective</span>
                    <span class="card-arrow">Explore →</span>
                </button>

                <button class="portfolio-card" data-section="education">
                    <span class="card-number">02</span>
                    <span class="card-icon">🎓</span>
                    <span class="card-title">Education</span>
                    <span class="card-description">My academic journey</span>
                    <span class="card-arrow">Explore →</span>
                </button>

                <button class="portfolio-card" data-section="skills">
                    <span class="card-number">03</span>
                    <span class="card-icon">💻</span>
                    <span class="card-title">Technical Skills</span>
                    <span class="card-description">Technologies and tools I use</span>
                    <span class="card-arrow">Explore →</span>
                </button>

                <button class="portfolio-card" data-section="projects">
                    <span class="card-number">04</span>
                    <span class="card-icon">🚀</span>
                    <span class="card-title">My Projects</span>
                    <span class="card-description">My development work</span>
                    <span class="card-arrow">Explore →</span>
                </button>

                <button class="portfolio-card" data-section="experience">
                    <span class="card-number">05</span>
                    <span class="card-icon">💼</span>
                    <span class="card-title">Experience</span>
                    <span class="card-description">Training and practical learning</span>
                    <span class="card-arrow">Explore →</span>
                </button>

                <button class="portfolio-card" data-section="certifications">
                    <span class="card-number">06</span>
                    <span class="card-icon">📜</span>
                    <span class="card-title">Certifications</span>
                    <span class="card-description">Courses and certificates</span>
                    <span class="card-arrow">Explore →</span>
                </button>

                <button class="portfolio-card" data-section="achievements">
                    <span class="card-number">07</span>
                    <span class="card-icon">🏆</span>
                    <span class="card-title">Achievements</span>
                    <span class="card-description">My accomplishments</span>
                    <span class="card-arrow">Explore →</span>
                </button>

                <button class="portfolio-card" data-section="resume">
                    <span class="card-number">08</span>
                    <span class="card-icon">📄</span>
                    <span class="card-title">My Resume</span>
                    <span class="card-description">View my professional CV</span>
                    <span class="card-arrow">Explore →</span>
                </button>

                <button class="portfolio-card" data-section="profiles">
                    <span class="card-number">09</span>
                    <span class="card-icon">🌐</span>
                    <span class="card-title">Professional Profiles</span>
                    <span class="card-description">GitHub and LinkedIn</span>
                    <span class="card-arrow">Explore →</span>
                </button>

                <button class="portfolio-card" data-section="contact">
                    <span class="card-number">10</span>
                    <span class="card-icon">✉️</span>
                    <span class="card-title">Contact Me</span>
                    <span class="card-description">Let's connect</span>
                    <span class="card-arrow">Explore →</span>
                </button>

            </div>
        </section>

        <!-- HIDDEN INFORMATION -->
        <section id="details" class="details hidden">

            <button id="backButton" class="back-button">← Back to Portfolio</button>

            <div id="detailsContent"></div>

        </section>

    </main>

    <footer>
        <p>© 2026 Fakhrunisa | All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
